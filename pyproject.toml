[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-http-client"
version = "0.4.0"
description = "Minimal retry client factories for Requests, HTTPX, and aiohttp."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32.5,<3",
    "urllib3>=2.6.3,<3",
]

[project.optional-dependencies]
httpx = [
    "httpx>=0.28.1,<1",
    "httpx-retries>=0.4.6,<0.5",
]
aiohttp = [
    "aiohttp>=3.13.5,<3.14",
]
all = [
    "aiohttp>=3.13.5,<3.14",
    "httpx>=0.28.1,<1",
    "httpx-retries>=0.4.6,<0.5",
]

[dependency-groups]
dev = [
    "aiohttp>=3.13.5,<3.14",
    "httpx>=0.28.1,<1",
    "httpx-retries>=0.4.6,<0.5",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resilient_http = ["py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PIE",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    # Keep public annotations introspectable on Python 3.9. PEP 604 unions
    # parse with postponed annotations but fail when get_type_hints evaluates them.
    "UP007",
    "UP045",
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["resilient_http"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
