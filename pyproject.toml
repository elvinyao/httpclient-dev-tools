[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-http-client"
version = "0.1.0"
description = "A policy-driven HTTPX client with configurable retries and domain-friendly exceptions."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resilient_http = ["py.typed"]
